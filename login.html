<!DOCTYPE html>
<html lang="en">
<head>
    <title>Bmazon - Login</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/x-icon" href="assets/img/favicon.ico">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/templatemo.css">
    <link rel="stylesheet" href="assets/css/custom.css">
    <link rel="stylesheet" href="assets/css/fontawesome.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light shadow">
    <div class="container">
        <a class="navbar-brand text-success logo h1" href="index.html">Bmazon</a>
        <div class="ms-auto"><a class="nav-link" href="shop.html">Continue shopping</a></div>
    </div>
</nav>
<main class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width:540px">
        <div class="card-body p-5 text-center">
            <i class="fa fa-user-lock text-success display-4" aria-hidden="true"></i>
            <h1 class="h2 mt-3">Sign in to Bmazon</h1>
            <p class="text-muted">Secure authentication is provided by Amazon Cognito. Your password is never handled by this website.</p>
            <div class="form-check text-start my-4 mx-auto" style="max-width:240px">
                <input id="rememberMe" class="form-check-input" type="checkbox">
                <label class="form-check-label" for="rememberMe">Remember me on this device</label>
            </div>
            <button id="loginButton" class="btn btn-success btn-lg w-100">Continue to secure login</button>
            <p class="small text-muted mt-4">Cognito also provides account registration, email verification, and password recovery.</p>
        </div>
    </div>
</main>
<script src="assets/js/config.js"></script>
<script src="assets/js/auth.js"></script>
<script>
    document.getElementById("loginButton").addEventListener("click", () => {
        BmazonAuth.login(document.getElementById("rememberMe").checked);
    });
</script>
</body>
</html>
