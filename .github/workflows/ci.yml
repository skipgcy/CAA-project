name: CI

env:
  SAM_CLI_TELEMETRY: 0

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - uses: aws-actions/setup-sam@v2
      - uses: hashicorp/setup-terraform@v4
      - name: Scan source, dependencies, secrets, and IaC with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: 1
      - name: Run automated tests
        run: npm test
      - name: Start isolated SonarQube Community Build
        run: bash .github/scripts/start-sonarqube.sh
      - name: SonarQube static analysis and Quality Gate
        uses: SonarSource/sonarqube-scan-action@v8.1.0
      - name: Record SonarQube result
        run: bash .github/scripts/summarize-sonarqube.sh
      - name: Stop isolated SonarQube
        if: always()
        run: docker rm --force sonarqube-ci >/dev/null 2>&1 || true
      - name: Validate SAM templates
        run: |
          sam validate --template-file infra/template.yaml --lint
          sam validate --template-file infra/domain-template.yaml --lint
      - name: Build Lambda artifacts
        run: sam build --template-file infra/template.yaml --parallel
      - name: Validate Terraform
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
