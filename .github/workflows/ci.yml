name: CI

env:
  SAM_CLI_TELEMETRY: 0

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: aws-actions/setup-sam@v2
      - uses: hashicorp/setup-terraform@v3
      - name: Run automated tests
        run: npm test
      - name: Validate SAM templates
        run: |
          sam validate --template-file infra/template.yaml --lint
          sam validate --template-file infra/domain-template.yaml --lint
      - name: Build Lambda artifacts
        run: sam build --template-file infra/template.yaml --parallel
      - name: Validate Terraform
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
