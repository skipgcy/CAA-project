AWSTemplateFormatVersion: '2010-09-09'
Description: Bmazon custom domain, CloudFront, Route 53, and API Gateway domain

Parameters:
  HostedZoneId:
    Type: String
  WebsiteCertificateArn:
    Type: String
  WebsiteBucketName:
    Type: String
  HttpApiId:
    Type: String
  HttpApiStage:
    Type: String
    Default: prod

Resources:
  ApiCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: api.ezei.shop
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: api.ezei.shop
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Project
          Value: CAA900-Bmazon

  WebsiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: bmazon-s3-oac
        Description: Private access from CloudFront to the Bmazon website bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WwwRedirectFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: bmazon-www-to-apex
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect the www hostname to the canonical apex domain
        Runtime: cloudfront-js-1.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.headers.host && request.headers.host.value === 'www.ezei.shop') {
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: { location: { value: 'https://ezei.shop' + request.uri } }
            };
          }
          return request;
        }

  WebsiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Bmazon production website
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Aliases:
          - ezei.shop
          - www.ezei.shop
        Origins:
          - Id: WebsiteS3Origin
            DomainName: !Sub ${WebsiteBucketName}.s3.${AWS::Region}.amazonaws.com
            OriginAccessControlId: !GetAtt WebsiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: WebsiteS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt WwwRedirectFunction.FunctionARN
        ViewerCertificate:
          AcmCertificateArn: !Ref WebsiteCertificateArn
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only
      Tags:
        - Key: Project
          Value: CAA900-Bmazon

  RootAliasIPv4:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: ezei.shop
      Type: A
      AliasTarget:
        DNSName: !GetAtt WebsiteDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  RootAliasIPv6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: ezei.shop
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt WebsiteDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  WwwAliasIPv4:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: www.ezei.shop
      Type: A
      AliasTarget:
        DNSName: !GetAtt WebsiteDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  WwwAliasIPv6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: www.ezei.shop
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt WebsiteDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  ApiDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Properties:
      DomainName: api.ezei.shop
      DomainNameConfigurations:
        - CertificateArn: !Ref ApiCertificate
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2
      Tags:
        Project: CAA900-Bmazon

  ApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Properties:
      ApiId: !Ref HttpApiId
      DomainName: !Ref ApiDomain
      Stage: !Ref HttpApiStage

  ApiAliasIPv4:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: api.ezei.shop
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApiDomain.RegionalDomainName
        HostedZoneId: !GetAtt ApiDomain.RegionalHostedZoneId

  ApiAliasIPv6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: api.ezei.shop
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt ApiDomain.RegionalDomainName
        HostedZoneId: !GetAtt ApiDomain.RegionalHostedZoneId

Outputs:
  DistributionId:
    Value: !Ref WebsiteDistribution
  DistributionDomainName:
    Value: !GetAtt WebsiteDistribution.DomainName
  WebsiteUrl:
    Value: https://ezei.shop
  ApiUrl:
    Value: https://api.ezei.shop
  ApiCertificateArn:
    Value: !Ref ApiCertificate
