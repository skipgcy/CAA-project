<!DOCTYPE html>
<html lang="en">
<head>
    <title>Bmazon - Checkout</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/x-icon" href="assets/img/favicon.ico">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/templatemo.css">
    <link rel="stylesheet" href="assets/css/custom.css">
    <link rel="stylesheet" href="assets/css/fontawesome.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light shadow">
    <div class="container">
        <a class="navbar-brand text-success logo h1" href="index.html">Bmazon</a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="shop.html">Products</a></li>
                <li class="nav-item"><a class="nav-link" href="orders.html">Orders</a></li>
                <li class="nav-item">
                    <a class="nav-link position-relative" href="cart.html" aria-label="Shopping cart">
                        <i class="fa fa-shopping-cart"></i>
                        <span class="badge bg-success" data-cart-count>0</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-5">
    <h1 class="h2 mb-4">Secure Checkout</h1>
    <div id="checkoutMessage" class="alert d-none" role="alert"></div>
    <form id="checkoutForm">
        <div class="row g-4">
            <section class="col-lg-7" aria-labelledby="shippingHeading">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h2 id="shippingHeading" class="h4 mb-4">Shipping information</h2>
                        <div class="row g-3">
                            <div class="col-12">
                                <label for="customerName" class="form-label">Full name</label>
                                <input id="customerName" name="customerName" class="form-control" autocomplete="name" required maxlength="100">
                            </div>
                            <div class="col-12">
                                <label for="email" class="form-label">Email</label>
                                <input id="email" name="email" type="email" class="form-control" autocomplete="email" required maxlength="254">
                            </div>
                            <div class="col-12">
                                <label for="address" class="form-label">Street address</label>
                                <input id="address" name="address" class="form-control" autocomplete="street-address" required maxlength="200">
                            </div>
                            <div class="col-md-5">
                                <label for="city" class="form-label">City</label>
                                <input id="city" name="city" class="form-control" autocomplete="address-level2" required maxlength="80">
                            </div>
                            <div class="col-md-4">
                                <label for="province" class="form-label">Province</label>
                                <select id="province" name="province" class="form-select" autocomplete="address-level1" required>
                                    <option value="">Choose...</option>
                                    <option>ON</option><option>BC</option><option>AB</option><option>QC</option>
                                    <option>MB</option><option>SK</option><option>NS</option><option>NB</option>
                                    <option>NL</option><option>PE</option><option>NT</option><option>NU</option><option>YT</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label for="postalCode" class="form-label">Postal code</label>
                                <input id="postalCode" name="postalCode" class="form-control" autocomplete="postal-code"
                                       required pattern="[A-Za-z]\d[A-Za-z][ -]?\d[A-Za-z]\d" placeholder="A1A 1A1">
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <aside class="col-lg-5" aria-labelledby="summaryHeading">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h2 id="summaryHeading" class="h4">Order summary</h2>
                        <div id="checkoutItems"></div>
                        <div class="pt-3">
                            <div class="d-flex justify-content-between"><span>Subtotal</span><strong id="checkoutSubtotal">$0.00</strong></div>
                            <div class="d-flex justify-content-between"><span>HST (13%)</span><strong id="checkoutTax">$0.00</strong></div>
                            <div class="d-flex justify-content-between"><span>Shipping</span><strong id="checkoutShipping">$0.00</strong></div>
                            <hr>
                            <div class="d-flex justify-content-between h5"><span>Total</span><strong id="checkoutTotal">$0.00</strong></div>
                        </div>
                        <button id="placeOrderButton" class="btn btn-success btn-lg w-100 mt-3" type="submit">Continue to secure payment</button>
                        <p class="small text-muted mt-3 mb-0">Payment details are never collected by this page. Stripe Checkout will be connected in the payment milestone.</p>
                    </div>
                </div>
            </aside>
        </div>
    </form>
</main>

<footer class="bg-dark text-light py-4 mt-5">
    <div class="container">Copyright &amp; Designed by Chenyu</div>
</footer>
<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/auth.js"></script>
<script>
    BmazonAuth.handleCallback().catch((error) => {
        const message = document.getElementById("checkoutMessage");
        message.textContent = `Login failed: ${error.message}`;
        message.className = "alert alert-danger";
    });
</script>
<script src="assets/js/store.js"></script>
<script src="assets/js/checkout.js"></script>
</body>
</html>
