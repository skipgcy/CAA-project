sonar.projectKey=bmazon-capstone
sonar.projectName=Bmazon Capstone Project
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.tests=tests
sonar.exclusions=tests/**,node_modules/**,.git/**,.github/**,.aws-sam*/**,terraform-dr/.terraform/**,terraform-dr/.frontend/**,terraform-dr/evidence/**,docs/**,output/**,tmp/**,assets/js/jquery*.js,assets/js/bootstrap*.js,assets/js/slick*.js,assets/js/nouislider*.js
sonar.test.inclusions=tests/**

# The scanner waits for the server result so a failed Quality Gate blocks CI.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
